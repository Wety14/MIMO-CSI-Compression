<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CSI Feedback Compression (three.js)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#0a1018; --panel:#111b27; --line:#25364a; --fg:#e8eef5; --muted:#8ea2b6;
  --accent:#4cc9f0; --f1:#ff7a59; --f2:#ffd166; --f3:#b388ff; --warn:#ff5c6c; --good:#5fd38d;
  --road:#0d151f; --grid:#1a2a3b; --roof:#25384c; --sideA:#182634; --sideB:#111c27;
  --display:'Space Grotesk',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark; box-sizing:border-box;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f5f8; --panel:#ffffff; --line:#c9d5e0; --fg:#0e1a26; --muted:#52677a;
  --accent:#0a7ea4; --f1:#d9482b; --f2:#b98200; --f3:#6f42e0; --warn:#d1303a; --good:#1b9657;
  --road:#e4eaf0; --grid:#d5dee7; --roof:#dde6ee; --sideA:#bfcddb; --sideB:#a9bacb; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f5f8; --panel:#ffffff; --line:#c9d5e0; --fg:#0e1a26; --muted:#52677a;
  --accent:#0a7ea4; --f1:#d9482b; --f2:#b98200; --f3:#6f42e0; --warn:#d1303a; --good:#1b9657;
  --road:#e4eaf0; --grid:#d5dee7; --roof:#dde6ee; --sideA:#bfcddb; --sideB:#a9bacb; color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 14px/1.4 var(--display);overflow:hidden}
#app{position:relative;height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#dim{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none}
#qlab{position:absolute;display:none;transform:translate(-50%,0);font:500 12px var(--mono);color:var(--warn);pointer-events:none;white-space:nowrap}
#top{position:absolute;top:18px;left:max(16px,env(safe-area-inset-left,0px));right:260px;pointer-events:none}
#count{font:500 12px var(--mono);letter-spacing:.14em;color:var(--muted)}
#count b{color:var(--accent);font-weight:500}
#cap{margin:4px 0 0;font:700 clamp(26px,4.4vw,58px)/1.02 var(--display);letter-spacing:-.025em;text-wrap:balance}
#sub{margin-top:8px;font:400 clamp(13px,1.5vw,18px) var(--mono);color:var(--muted);letter-spacing:.02em}
.swap{animation:swap .55s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#hud{position:absolute;top:20px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;width:224px;pointer-events:none}
.g{opacity:0;transform:translateX(12px);transition:opacity .5s,transform .5s}
.g.on{opacity:1;transform:none}
.gl{display:flex;justify-content:space-between;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gl b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.tr{margin-top:5px;height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.fl{height:100%;width:0;border-radius:5px;background:var(--good);transition:width .3s linear,background .4s}
.fl.warn{background:var(--warn)}
#legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:76px;display:flex;gap:8px;flex-wrap:wrap;opacity:0;transition:opacity .5s;pointer-events:none}
#legend.on{opacity:1}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font:500 12px var(--mono)}
.chip i{width:18px;height:3px;border-radius:2px;display:block}
.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;width:min(420px,40vw);transform:translate(24px,-50%);opacity:0;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1)}
.panel.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.panel.wide{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-width:1000px;margin-inline:auto;top:56%}
#p9{width:min(300px,32vw)}
.eq{font:500 clamp(14px,1.5vw,19px) var(--mono);opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.eq.show{opacity:1;transform:none}
.eq b{color:var(--accent);font-weight:500}
#csiCv{width:100%;aspect-ratio:400/236;display:block}
#aeCv{width:100%;aspect-ratio:960/330;display:block}
#link{font:500 12px var(--mono);color:var(--muted);min-height:18px;font-variant-numeric:tabular-nums}
#link b{color:var(--fg);font-weight:500}
.ghost{align-self:flex-start;background:none;border:1px solid var(--line);color:var(--fg);font:500 12px var(--mono);border-radius:999px;padding:6px 14px;cursor:pointer}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost:focus-visible,.nb:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ph,.row{display:grid;grid-template-columns:34px 1fr 16px 1fr;align-items:center;gap:6px}
.ph{font:500 11px var(--mono);letter-spacing:.12em;color:var(--muted);text-align:center}
.row{padding:5px 0;border-top:1px solid var(--line);transition:background .6s}
.row.flash{background:color-mix(in srgb,var(--accent) 16%,transparent);transition:none}
.row span{font:500 12px var(--mono);color:var(--muted)}
.row canvas{width:100%;aspect-ratio:2/1;display:block}
.row .ap{text-align:center;color:var(--muted)}
.note{font:500 13px var(--mono);color:var(--muted);text-align:center}
#nav{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;align-items:center;justify-content:center;gap:14px}
.nb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 18px var(--mono);cursor:pointer;display:grid;place-items:center}
.nb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nb:disabled{opacity:.3;cursor:default}
#dots{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:5px;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .3s,background .3s}
.dot.on{width:28px;background:var(--accent)}
#keys{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:26px;font:400 11px var(--mono);color:var(--muted);letter-spacing:.08em}
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 12px var(--mono);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tip.on{opacity:1}
#tip b{display:block;font:700 14px var(--display);margin-bottom:2px}
#tip svg{display:block;margin-top:8px}
@media (max-width:820px){
  #top{right:16px} #hud{top:auto;bottom:128px;width:190px} #keys{display:none}
  .panel,.panel.wide,#p9{width:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;bottom:70px;max-height:44vh;overflow:auto;transform:translateY(24px)}
  .panel.on{transform:none}
}
@media (prefers-reduced-motion:reduce){.swap{animation:none}.panel,.g,.eq{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="3D network scene"></canvas>
  <div id="dim"></div>
  <div id="qlab"></div>
  <header id="top">
    <div id="count"><b id="cn">01</b> / 09</div>
    <h1 id="cap">MIMO 8×8 · FDD</h1>
    <div id="sub">Hover an antenna</div>
  </header>
  <div id="hud">
    <div class="g" id="gTx"><div class="gl"><span>Tx energy</span><b id="vTx">100%</b></div><div class="tr"><div class="fl warn" id="fTx"></div></div></div>
    <div class="g" id="gBat"><div class="gl"><span>UE battery</span><b id="vBat">100%</b></div><div class="tr"><div class="fl" id="fBat"></div></div></div>
    <div class="g" id="gUp"><div class="gl"><span>Uplink load</span><b id="vUp">0%</b></div><div class="tr"><div class="fl" id="fUp"></div></div></div>
  </div>
  <div id="legend"><span class="chip"><i style="background:var(--f1)"></i>700 MHz</span><span class="chip"><i style="background:var(--f2)"></i>3.5 GHz</span><span class="chip"><i style="background:var(--f3)"></i>26 GHz</span></div>
  <aside class="panel" id="p5">
    <div class="eq" id="eq1">8 × 8 = <b>64</b> links</div>
    <canvas id="csiCv"></canvas>
    <div id="link">&nbsp;</div>
    <div class="eq" id="eq2">1 link = <b>power</b> + <b>delay</b></div>
    <div class="eq" id="eq3">64 × 2 = <b>128</b> values → <b>H</b></div>
    <button class="ghost" id="replay" type="button">↻ Replay</button>
  </aside>
  <aside class="panel wide" id="p8">
    <canvas id="aeCv"></canvas>
    <button class="ghost" id="resample" type="button">↻ New H</button>
  </aside>
  <aside class="panel" id="p9">
    <div class="ph"><span>UE</span><span>H</span><span></span><span>Ĥ</span></div>
    <div id="rows"></div>
    <div class="note">Ĥ ≈ H</div>
  </aside>
  <div id="keys">← → NAVIGATE</div>
  <nav id="nav"><button class="nb" id="prev" type="button" aria-label="Previous">←</button><div id="dots"></div><button class="nb" id="next" type="button" aria-label="Next">→</button></nav>
  <div id="tip"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,fr=v=>v-Math.floor(v);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('cv');
let W=0,H=0,DPR=1,time=0;
const cs=getComputedStyle(document.documentElement);
const C={};
['bg','panel','line','fg','muted','accent','f1','f2','f3','warn','good','road','grid','roof','sideA','sideB'].forEach(k=>C[k]='#888888');
function readTheme(){for(const k in C){const v=cs.getPropertyValue('--'+k).trim();if(/^#[0-9a-f]{6}$/i.test(v))C[k]=v;}}
const hexc={};
function A(hex,a){let c=hexc[hex];if(!c){const h=hex.slice(1);c=hexc[hex]=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function mkLUT(st){const o=[];for(let i=0;i<64;i++){const t=i/63;let k=0;while(k<st.length-2&&t>st[k+1][0])k++;const[t0,c0]=st[k],[t1,c1]=st[k+1],u=clamp((t-t0)/(t1-t0),0,1);o.push('rgb('+c0.map((v,j)=>Math.round(lerp(v,c1[j],u))).join(',')+')');}return o;}
const HEAT=mkLUT([[0,[27,42,107]],[.35,[31,143,168]],[.65,[123,211,137]],[1,[255,230,109]]]);
const LAT=mkLUT([[0,[59,31,107]],[.5,[192,69,122]],[1,[255,180,90]]]);
const heat=v=>HEAT[clamp(Math.round(v*63),0,63)],lat=v=>LAT[clamp(Math.round(v*63),0,63)];
function rng(s){s=(s>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

/* ---- channel data: H is 8 Tx rows x 16 cols (8 power | 8 delay) = 128 coefficients ---- */
function Hvals(x,y){const a=new Float32Array(128);
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const P=.52+.27*Math.sin(.9*i+.6*j+.55*x+.4*y)+.16*Math.sin(1.7*i-1.3*j+.8*y-.45*x+1);
    const T=.5+.28*Math.sin(.7*i-.5*j+.35*x-.6*y+2)+.15*Math.cos(1.5*i+1.1*j+.6*x+.5*y);
    a[i*16+j]=clamp(P,0,1);a[i*16+8+j]=clamp(T,0,1);}
  return a;}
function pool(Hm){const z=new Float32Array(16);
  for(let br=0;br<4;br++)for(let bc=0;bc<4;bc++){let s=0;for(let r=0;r<2;r++)for(let c=0;c<4;c++)s+=Hm[(br*2+r)*16+bc*4+c];z[br*4+bc]=s/8;}return z;}
function decodeH(Hm,seed){const r=rng(seed),o=new Float32Array(128),bad=new Uint8Array(128);
  for(let k=0;k<128;k++)o[k]=clamp(Hm[k]+(r()-.5)*.07,0,1);
  for(let n=0;n<6;n++){const k=Math.floor(r()*128);o[k]=clamp(Hm[k]+(r()<.5?-1:1)*(.13+r()*.07),0,1);bad[k]=1;}
  return{o,bad};}
function drawH(g,arr,x,y,cell,reveal,lut,bad){const gap=cell*.7,n=Math.floor(128*reveal);
  for(let i=0;i<8;i++)for(let c=0;c<16;c++){const k=i*16+c;if(k>=n)continue;
    const px=x+c*cell+(c>=8?gap:0),py=y+i*cell;g.fillStyle=lut(arr[k]);g.fillRect(px,py,cell-1,cell-1);
    if(bad&&bad[k]){g.strokeStyle=C.fg;g.lineWidth=1.2;g.strokeRect(px+.5,py+.5,cell-2,cell-2);}}}
function drawZ(g,z,x,y,cell,reveal){const n=Math.floor(16*reveal);
  for(let k=0;k<n;k++){g.fillStyle=lat(z[k]);g.fillRect(x+(k%4)*cell,y+Math.floor(k/4)*cell,cell-1.5,cell-1.5);}}

/* ---- world data (units: x,y on the ground, z up) ---- */
const BL=[];
for(let i=0;i<4;i++)for(let j=0;j<3;j++){const gn=i===1&&j===1;
  const cx=-9.3+i*5+1.8,cy=-5.3+j*4+1.3;BL.push({x0:cx-1.45,y0:cy-.95,x1:cx+1.45,y1:cy+.95,cx,cy,h:gn?3.1:1.7+((i*5+j*3+((i*j)%2)*2)%5)*.25,gnb:gn});}
const G={x:-2.5,y:0,base:3.1,mast:.95};
const UES=[
 {pts:[[0,2],[5,2],[5,-2],[0,-2],[0,2]],mode:'loop',u0:3,speed:.7,col:'#4cc9f0'},
 {pts:[[-5,-2],[0,-2],[0,2],[-5,2],[-5,-2]],mode:'loop',u0:16,speed:.8,col:'#ffb454'},
 {pts:[[-5,-2],[5,-2]],mode:'pp',u0:8,speed:.9,col:'#b388ff'},
 {pts:[[0,-2],[0,2]],mode:'pp',u0:1,speed:.6,col:'#5fd38d'},
 {pts:[[-5,2],[0,2]],mode:'pp',u0:2,speed:.7,col:'#ff7a8a'},
 {pts:[[5,-2],[5,2]],mode:'pp',u0:3,speed:.6,col:'#f2e86d'}];
UES.forEach(u=>{u.cum=[0];for(let i=1;i<u.pts.length;i++)u.cum.push(u.cum[i-1]+Math.hypot(u.pts[i][0]-u.pts[i-1][0],u.pts[i][1]-u.pts[i-1][1]));u.total=u.cum[u.cum.length-1];u.u=u.u0;u.nx=0;u.ph=0;});
function pathPos(ue,u){const T=ue.total;if(ue.mode==='pp'){const m=u%(2*T);u=m<T?m:2*T-m;}else u=((u%T)+T)%T;
  let k=1;while(k<ue.cum.length-1&&u>ue.cum[k])k++;const a=ue.pts[k-1],b=ue.pts[k],t=(u-ue.cum[k-1])/(ue.cum[k]-ue.cum[k-1]);return[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];}

/* ---- state, tweens ---- */
const V={p:0,pw:0,others:1,omni:1,beam:0,scan:0,ask:0,rays:0,move:0,home:1,dim:0,legend:0,bat:0,hint:1};
const tws={};
function tw(k,to,dur=.9,delay=0){tws[k]={from:V[k],to,t:-delay,dur:RM?.01:dur};}
function stepTw(dt){for(const k in tws){const w=tws[k];w.t+=dt;if(w.t<0)continue;const u=clamp(w.t/w.dur,0,1);V[k]=lerp(w.from,w.to,ease(u));if(u>=1)delete tws[k];}}
UES.forEach((u,i)=>{const p=pathPos(u,u.u0);u.x=p[0];u.y=p[1];});

/* =====================================================================
   THREE.JS SCENE
   Convention : le monde logique est (x,y,z) avec z vers le haut.
   three.js est en Y-up -> on convertit (x,y,z) => (x, z, -y).
   ===================================================================== */
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.1,300);
const T3=(x,y,z)=>new THREE.Vector3(x,z,-y);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(-6,12,4);scene.add(sun);

const M={
  grid:new THREE.LineBasicMaterial({transparent:true,depthWrite:false}),
  road:new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),
  dash:new THREE.LineDashedMaterial({transparent:true,depthWrite:false,dashSize:.3,gapSize:.4}),
  sideA:new THREE.MeshLambertMaterial({transparent:true,opacity:.42,depthWrite:false}),sideB:new THREE.MeshLambertMaterial({transparent:true,opacity:.42,depthWrite:false}),roof:new THREE.MeshLambertMaterial({transparent:true,opacity:.5,depthWrite:false}),
  edge:new THREE.LineBasicMaterial({transparent:true}),
  edgeG:new THREE.LineBasicMaterial({transparent:true}),
  mast:new THREE.MeshBasicMaterial(),
  head:new THREE.MeshLambertMaterial(),
  ant:new THREE.MeshBasicMaterial({color:0xffffff}),
  omni:new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide}),
  shadow:new THREE.MeshBasicMaterial({transparent:true,depthWrite:false}),
  pole:new THREE.MeshBasicMaterial({transparent:true}),
  path:new THREE.LineDashedMaterial({transparent:true,dashSize:.22,gapSize:.22})
};

/* ground grid */
{const p=[];for(let x=-10;x<=10;x++)p.push(x,0,6.5,x,0,-6.5);for(let y=-6;y<=6;y++)p.push(-10,0,-y,10,0,-y);
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 const l=new THREE.LineSegments(g,M.grid);l.position.y=.004;scene.add(l);}
/* roads */
const roads=new THREE.Group();scene.add(roads);
[-5,0,5].forEach(c=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(2,13).rotateX(-Math.PI/2),M.road);m.position.set(c,.001,0);roads.add(m);});
[-2,2].forEach(c=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(20,2).rotateX(-Math.PI/2),M.road);m.position.set(0,.001,-c);roads.add(m);});
const dashLines=(()=>{const p=[];[-5,0,5].forEach(c=>p.push(c,0,6.5,c,0,-6.5));[-2,2].forEach(c=>p.push(-10,0,-c,10,0,-c));
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  const l=new THREE.LineSegments(g,M.dash);l.computeLineDistances();l.position.y=.005;scene.add(l);return l;})();
/* buildings */
const boxGeo=new THREE.BoxGeometry(1,1,1).translate(0,.5,0),edgeGeo=new THREE.EdgesGeometry(boxGeo);
const bMeshes=BL.map(b=>{
  const mesh=new THREE.Mesh(boxGeo,[M.sideA,M.sideA,M.roof,M.roof,M.sideB,M.sideB]);
  mesh.scale.set(b.x1-b.x0,.001,b.y1-b.y0);mesh.position.set(b.cx,0,-b.cy);
  mesh.add(new THREE.LineSegments(edgeGeo,b.gnb?M.edgeG:M.edge));scene.add(mesh);return mesh;});

/* gNB : mast + head with 8 antenna dots */
const gnbGroup=new THREE.Group();scene.add(gnbGroup);
const mast=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1,10).translate(0,.5,0),M.mast);scene.add(mast);
const gHead=new THREE.Group();gnbGroup.add(gHead);
gHead.add(new THREE.Mesh(new THREE.BoxGeometry(.42,.3,.42),M.head));
for(let r=0;r<2;r++)for(let c=0;c<4;c++){const s=new THREE.Mesh(new THREE.SphereGeometry(.035,20,14),M.ant);s.position.set(-.15+c*.1,.17,-.05+r*.1);gHead.add(s);}

/* sprite helpers */
function mkSprite(w,h,draw,sw,sh,opts){opts=opts||{};
  const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.minFilter=opts.mip?THREE.LinearMipmapLinearFilter:THREE.LinearFilter;t.anisotropy=4;
  const m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:opts.depthTest===true,depthWrite:false});
  const s=new THREE.Sprite(m);s.scale.set(sw,sh,1);s.renderOrder=opts.order||10;

/* ---- multipath (1-bounce image method) ---- */
function segHits(a,b){ // Does segment a->b intersect a building? (AABB/slab test)
  for(const bl of BL){const e=.03,mn=[bl.x0+e,bl.y0+e,0],mx=[bl.x1-e,bl.y1-e,bl.h-e];let t0=0,t1=1,ok=true;
    for(let k=0;k<3;k++){const d=b[k]-a[k];
      if(Math.abs(d)<1e-9){if(a[k]<mn[k]||a[k]>mx[k]){ok=false;break;}}
      else{let u0=(mn[k]-a[k])/d,u1=(mx[k]-a[k])/d;if(u0>u1){const t=u0;u0=u1;u1=t;}t0=Math.max(t0,u0);t1=Math.min(t1,u1);if(t0>t1){ok=false;break;}}}
    if(ok)return true;}
  return false;}
function multipath(ux,uy,uz){const gz=G.base+G.mast,out=[];
  {const t=gz/(gz+uz);out.push({p:[G.x+(ux-G.x)*t,G.y+(uy-G.y)*t,0],len:Math.hypot(ux-G.x,uy-G.y,gz+uz)});}
  for(const b of BL){if(b.gnb||Math.hypot(b.cx-ux,b.cy-uy)>11)continue;
    const W4=[['x',b.x0,-1,b.y0,b.y1],['x',b.x1,1,b.y0,b.y1],['y',b.y0,-1,b.x0,b.x1],['y',b.y1,1,b.x0,b.x1]];
    for(const[ax,c,s,lo,hi]of W4){const ga=ax==='x'?G.x:G.y,ua=ax==='x'?ux:uy,go=ax==='x'?G.y:G.x,uo=ax==='x'?uy:ux;
      if((ga-c)*s<=0||(ua-c)*s<=0)continue;const t=(ga-c)/(ua-c+ga-c),o=go+t*(uo-go),z=gz+t*(uz-gz);
      if(o<lo||o>hi||z<.15||z>b.h)continue;
      out.push({p:ax==='x'?[c,o,z]:[o,c,z],len:Math.hypot(ua-(2*c-ga),uo-go,uz-gz)});}}
  // Direct path (line of sight)
  out.push({p:[(G.x+ux)/2,(G.y+uy)/2,(gz+uz)/2],len:Math.hypot(ux-G.x,uy-G.y,gz-uz)});
  // Diffraction at roof corners
  for(const b of BL){if(b.gnb)continue;
    for(const[cx,cy]of[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]])
      out.push({p:[cx,cy,b.h],len:Math.hypot(cx-G.x,cy-G.y,b.h-gz)+Math.hypot(ux-cx,uy-cy,uz-b.h)});}
  out.sort((a,b)=>a.len-b.len);
  const ga=[G.x,G.y,gz],ub=[ux,uy,uz],ok=out.filter(c=>!segHits(ga,c.p)&&!segHits(c.p,ub));
  // Keep up to six distinct paths, preferring widely separated reflections.
  const sel=[];
  for(const c of ok){if(sel.length>=6)break;if(sel.every(q=>Math.hypot(q.p[0]-c.p[0],q.p[1]-c.p[1])>1.2))sel.push(c);}
  for(const c of ok){if(sel.length>=6)break;if(!sel.includes(c))sel.push(c);}
  sel.sort((a,b)=>a.len-b.len);return sel;}

function setupCamera(){
  const p=V.p,yaw=-.45*p,tilt=.98*p;
  const top=Math.max(96,H*.17),bot=74,aw=Math.max(200,W-V.pw),ah=Math.max(160,H-top-bot);
  const tanv=Math.tan(camera.fov*Math.PI/360);
  const u=lerp(Math.max(19.8/aw,11.8/ah),Math.max(27/aw,11.6/ah),p);   // world units per pixel
  const D=u*H/(2*tanv);
  const cx=aw/2,cy=top+ah/2+p*.55/u;
  camera.position.set(-Math.sin(tilt)*Math.sin(yaw)*D,Math.cos(tilt)*D,Math.sin(tilt)*Math.cos(yaw)*D);
  camera.up.set(Math.sin(yaw),0,-Math.cos(yaw));
  camera.lookAt(0,0,0);
  camera.setViewOffset(W,H,-(cx-W/2),-(cy-H/2),W,H);
  camera.updateMatrixWorld(true);
}
